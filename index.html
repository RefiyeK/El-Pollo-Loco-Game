<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>El Pollo Loco</title>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chickenbaby.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/bottle-pickup.class.js"></script>
    <script src="./models/coin-status-bar.class.js"></script>
    <script src="./models/boss-status-bar.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./models/world.class.js"></script> 
    <script src="./js/game.js"></script>
     
</head>
<body onload="init()">
    
    <h1>El Pollo Loco</h1>

    <div id="homeScreen">
        <img id="homeScreenImage" src="./img/9_intro_outro_screens/start/startscreen_1.png" alt="Home Screen">
        <div id="homeScreenButtons">
            <button id="playBtn">SPIELEN</button>
            <button id="soundBtn">TON AN</button>
            <button id="fullscreenBtn">VOLLBILD</button>
        </div>
    </div>

    <div id="controlPanel">
        <button id="startBtn">START</button>
        <button id="pauseBtn">PAUSE</button>
        <button id="musicBtn">MUSIK AN</button>
    </div>
    <canvas id="canvas" width="720" height="480"></canvas>

    <div id="gameOverPanel">
        <img id="gameOverImage" src="" alt="Game Over">
            <h2 id="gameOverText"></h2>
        <button id="restartBtn">NOCHMAL SPIELEN</button>
        <button id="homeBtn">HAUPTSEITE</button>
    </div>

    <div id="winPanel">
        <img id="winImage" src="" alt="Win Screen">
        <h2 id="winText"></h2>
        <button id="restartBtn">NOCHMAL SPIELEN</button>
        <button id="homeBtn">HAUPTSEITE</button>
    </div>


</body>
</html>
